name: Preview Deployment — Publish

on:
  workflow_run:
    workflows: ["Preview Deployment — Build"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: "Pull Request env"
    steps:
      - name: Find PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const prNumberArtifact = artifacts.data.artifacts.find(a => a.name.startsWith('pr-number-'));
            if (!prNumberArtifact) {
              core.setFailed('Could not find PR number artifact');
              return;
            }
            const prNumber = prNumberArtifact.name.replace('pr-number-', '');
            core.setOutput('number', prNumber);
            core.info(`PR number: ${prNumber}`);

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-${{ steps.pr.outputs.number }}
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: ./dist
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR #${{ steps.pr.outputs.number }}"
          alias: pr-${{ steps.pr.outputs.number }}
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');
            const deployUrl = '${{ steps.netlify.outputs.deploy-url }}';
            const body = `🚀 **Preview deployment ready!**\n\n🔗 ${deployUrl}\n\n<sub>Built from commit ${{ github.event.workflow_run.head_sha }}</sub>`;

            // Find and update existing comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployment ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
